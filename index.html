<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>FPP Fantasy</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;700;800&family=Oswald:wght@500;600;700&display=swap" rel="stylesheet">
<style>:root{color-scheme:dark}:root{
  --bg:#080d1c;--bg2:#0e1530;--panel:#131c3b;--panel2:#1a2547;--line:#26335f;
  --text:#e9edfb;--mute:#8f9bc4;--blue:#2f6df6;--red:#ef3b36;--orange:#ff8a1f;--green:#2fd18b;--gold:#ffc83d;
  --radius:12px;
  --head:"Oswald","Barlow Condensed","Arial Narrow",Impact,sans-serif;
  --body:"Inter","Segoe UI",system-ui,-apple-system,Roboto,Arial,sans-serif;
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--text);font:15px/1.45 var(--body)}
body{background:radial-gradient(1200px 500px at 70% -10%,#16275a 0%,transparent 60%),var(--bg);min-height:100vh}
a{color:#8db4ff;text-decoration:none}a:hover{text-decoration:underline}
h1,h2,h3,h4{font-family:var(--head);letter-spacing:.04em;text-transform:uppercase;margin:0 0 .5rem;font-weight:600}
h1{font-size:2rem}h2{font-size:1.35rem}h3{font-size:1.1rem}h4{font-size:.95rem;color:var(--mute)}
.wrap{max-width:1180px;margin:0 auto;padding:0 16px}
header.top{position:sticky;top:0;z-index:20;background:rgba(8,13,28,.92);backdrop-filter:blur(8px);border-bottom:1px solid var(--line)}
header.top .wrap{display:flex;align-items:center;gap:18px;height:58px}
.brand{display:flex;align-items:center;gap:10px;font-family:var(--head);font-size:1.35rem;letter-spacing:.08em;color:#fff;text-transform:uppercase}
.brand img{height:30px;border-radius:4px}.brand b{color:var(--orange)}
nav{display:flex;gap:4px;flex:1;overflow-x:auto}
nav a{color:var(--mute);padding:6px 11px;border-radius:8px;font-weight:600;font-size:.9rem;white-space:nowrap}
nav a.on,nav a:hover{background:var(--panel2);color:#fff;text-decoration:none}
.tok{background:var(--panel2);border:1px solid var(--line);border-radius:999px;padding:4px 12px;font-weight:700;white-space:nowrap;color:var(--gold)}
main{padding:22px 0 70px}
.card{background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);padding:16px;margin-bottom:16px}
.card.flat{background:transparent}
.grid{display:grid;gap:14px}
.g2{grid-template-columns:repeat(auto-fit,minmax(320px,1fr))}
.g3{grid-template-columns:repeat(auto-fill,minmax(250px,1fr))}
.g4{grid-template-columns:repeat(auto-fit,minmax(140px,1fr))}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}.sp{flex:1}
.mute{color:var(--mute)}.small{font-size:.82rem}.mt{margin-top:12px}
button,.btn{font:inherit;font-weight:700;background:var(--blue);color:#fff;border:0;border-radius:9px;padding:9px 16px;cursor:pointer;display:inline-block}
button:hover:not(:disabled),.btn:hover{filter:brightness(1.12);text-decoration:none}
button:disabled{opacity:.45;cursor:not-allowed}
button.ghost{background:transparent;border:1px solid var(--line);color:var(--text)}
button.warn{background:var(--red)}button.ok{background:#1fa971}button.sm{padding:5px 10px;font-size:.82rem}
input,select,textarea{font:inherit;color:var(--text);background:#0a1126;border:1px solid var(--line);border-radius:9px;padding:9px 11px;width:100%}
input:focus,select:focus{outline:2px solid var(--blue);outline-offset:-1px}
label{display:block;font-size:.8rem;color:var(--mute);margin:10px 0 4px;font-weight:600;text-transform:uppercase;letter-spacing:.05em}
input[type=checkbox],input[type=radio]{width:auto}
table{width:100%;border-collapse:collapse}
th{font-family:var(--head);text-transform:uppercase;letter-spacing:.06em;font-size:.8rem;color:var(--mute);text-align:left;padding:7px 8px;border-bottom:1px solid var(--line)}
td{padding:7px 8px;border-bottom:1px solid #1d2850}
tr.me td{background:rgba(255,138,31,.12)}
tr.cap td{background:rgba(47,109,246,.12)}
.tscroll{overflow-x:auto}
.chip{display:inline-block;border-radius:6px;padding:1px 8px;font-size:.74rem;font-weight:700;background:var(--panel2);border:1px solid var(--line);color:var(--mute);margin:0 4px 4px 0;white-space:nowrap}
.chip.trait{color:#c5d3ff}.chip.live{background:var(--red);color:#fff;border-color:transparent}
.chip.ok{background:#14543b;color:#8bf2c6;border-color:transparent}.chip.gold{background:#5c4600;color:var(--gold);border-color:transparent}
.rk{display:inline-block;min-width:34px;text-align:center;border-radius:6px;padding:1px 7px;font-family:var(--head);font-weight:700;letter-spacing:.04em;color:#0a0f20}
.rk.s{background:linear-gradient(135deg,#ffe27a,#ffa928)}.rk.a{background:#42e0a0}.rk.b{background:#6aa6ff}.rk.c{background:#b69bff}.rk.d{background:#ffa15a}.rk.f{background:#ff7676}
/* robot cards */
.rcard{background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);overflow:hidden;display:flex;flex-direction:column}
.rcard .pic{aspect-ratio:4/3;background:linear-gradient(135deg,#1c2b66,#0d1330);position:relative;display:grid;place-items:center}
.rcard .pic img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.rcard .pic .num{font-family:var(--head);font-size:3.2rem;color:#ffffff30;font-weight:700}
.rcard .pic .rk{position:absolute;top:8px;right:8px;font-size:1.1rem;padding:2px 10px}
.rcard .bd{padding:12px;flex:1}
.rcard h3{margin:0}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;margin:8px 0}
.stats div{background:#0a1126;border-radius:8px;text-align:center;padding:5px 2px}
.stats b{display:block;font-family:var(--head);font-size:1.15rem}.stats span{font-size:.68rem;color:var(--mute);text-transform:uppercase;letter-spacing:.05em}
.rcard.sel{outline:3px solid var(--orange)}
.rcard.pick{cursor:pointer}
.price{color:var(--gold);font-weight:800}
/* hero */
.hero{display:flex;gap:18px;align-items:center;flex-wrap:wrap;margin-bottom:18px}
.hero h1{margin:0}
.bar{position:sticky;bottom:0;background:rgba(8,13,28,.95);border-top:1px solid var(--line);padding:12px 0;z-index:10}
/* auth */
.auth{max-width:420px;margin:30px auto}
.err{color:#ff8f8b;font-weight:600;margin-top:8px}
/* matches */
.alliances{display:grid;grid-template-columns:1fr 1fr;gap:12px}
@media(max-width:720px){.alliances{grid-template-columns:1fr}}
.ally{border-radius:var(--radius);padding:12px;border:2px solid}
.ally.red{border-color:var(--red);background:linear-gradient(180deg,rgba(239,59,54,.18),rgba(239,59,54,.04))}
.ally.blue{border-color:var(--blue);background:linear-gradient(180deg,rgba(47,109,246,.2),rgba(47,109,246,.04))}
.ally .tm{padding:7px 8px;border-radius:8px;margin-top:6px;background:#0a112680}
.ally .tm.me{outline:2px solid var(--orange)}
.dot{display:inline-block;width:8px;height:8px;border-radius:50%;background:#555;margin:0 4px}.dot.on{background:var(--green);box-shadow:0 0 6px var(--green)}
.timer{font-family:var(--head);font-size:4.4rem;line-height:1;font-weight:700;letter-spacing:.04em;text-align:center}
.phase{font-family:var(--head);text-transform:uppercase;letter-spacing:.14em;text-align:center;color:var(--orange);font-size:1.2rem}
.pending{text-align:center;font-family:var(--head);font-size:1.6rem;letter-spacing:.2em;color:#46507a;padding:14px 0}
.scorebig{font-family:var(--head);font-size:3rem;text-align:center;font-weight:700}
.scorebig.red{color:#ff6b66}.scorebig.blue{color:#6a9dff}
.strats{display:flex;gap:8px;flex-wrap:wrap}
.strat{flex:1;min-width:150px;text-align:left;background:var(--panel2);border:2px solid var(--line);padding:10px}
.strat.on{border-color:var(--orange);background:#3a2a17}
.strat small{display:block;font-weight:500;color:var(--mute)}
.climb{width:100%;font-family:var(--head);font-size:1.7rem;letter-spacing:.2em;padding:16px;background:#333b57;color:#7c86a8;border-radius:12px;text-transform:uppercase}
.climb.ready{background:var(--orange);color:#1a0d00;animation:pulse .5s infinite alternate}
.climb.done{background:#14543b;color:#8bf2c6}
@keyframes pulse{to{box-shadow:0 0 0 8px rgba(255,138,31,.25)}}
.progress{height:6px;background:#0a1126;border-radius:4px;overflow:hidden;margin:10px 0}.progress i{display:block;height:100%;background:var(--orange)}
.win{color:var(--green);font-weight:800}
.sched td.r{color:#ff8f8b}.sched td.b{color:#8db4ff}
/* bracket */
.bracket{display:flex;gap:18px;overflow-x:auto;padding-bottom:8px}
.bcol{min-width:190px;display:flex;flex-direction:column}.bcol h4{margin:0 0 8px}.bms{flex:1;display:flex;flex-direction:column;justify-content:space-around;gap:10px}
.bm{background:var(--panel2);border:1px solid var(--line);border-radius:10px;padding:8px;font-size:.82rem}
.bm .t{display:flex;justify-content:space-between;gap:6px;padding:2px 0}
.bm .t.w{font-weight:800;color:var(--green)}.bm .h{color:var(--mute);font-size:.7rem;text-transform:uppercase;letter-spacing:.08em}
.bm.live{outline:2px solid var(--orange)}
/* blue banner */
.shelf{display:flex;gap:16px;flex-wrap:wrap}
.banner{width:150px;text-align:center;color:#fff;background:#0f4bcb;padding:14px 10px 46px;clip-path:polygon(0 0,100% 0,100% 100%,50% 86%,0 100%);filter:drop-shadow(0 6px 8px #0008)}
.banner.big{width:220px;padding:20px 14px 70px}
.banner img{width:78%;display:block;margin:0 auto 10px}
.banner .ev{font-weight:900;font-style:italic;text-transform:uppercase;font-size:.95rem;line-height:1.15;letter-spacing:.02em}
.banner.big .ev{font-size:1.25rem}
.banner .ch{font-size:.9rem;margin-top:10px;letter-spacing:.06em;text-transform:uppercase}
.banner .gm{font-size:.82rem;margin-top:2px;letter-spacing:.14em;opacity:.95}
.banner.fin{background:#6b7280}
.bwrap{display:flex;flex-direction:column;align-items:center}
.bwrap .cap{font-size:.74rem;color:var(--mute);margin-top:2px;text-align:center}
.toast{position:fixed;left:50%;bottom:26px;transform:translateX(-50%);background:#1f2b57;border:1px solid var(--line);padding:11px 18px;border-radius:10px;z-index:99;box-shadow:0 8px 24px #000a}
.toast.err{background:#5a1c1c;border-color:#a33}
.kv{display:grid;grid-template-columns:140px 1fr;gap:6px 12px}.kv dt{color:var(--mute)}.kv dd{margin:0}
.tabs{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:12px}
.tabs a{padding:5px 12px;border:1px solid var(--line);border-radius:999px;color:var(--mute);font-weight:600;font-size:.85rem}.tabs a.on{background:var(--blue);border-color:var(--blue);color:#fff;text-decoration:none}
.turn{border:2px solid var(--orange);background:#2b1d0d}
.log{max-height:160px;overflow:auto;font-size:.82rem;color:var(--mute)}
.checks{display:flex;flex-wrap:wrap;gap:6px 14px}.checks label{margin:0;display:flex;align-items:center;gap:6px;text-transform:none;letter-spacing:0;font-size:.88rem;color:var(--text)}

.chip.fr{color:var(--gold);border-color:#6b5415;background:#2b2108}
.clk{cursor:pointer}tr.clk:hover td{background:#1e2c5c}.bm.clk:hover{border-color:var(--blue)}
.modal{position:fixed;inset:0;background:rgba(3,6,16,.8);z-index:80;display:flex;align-items:flex-start;justify-content:center;padding:30px 12px;overflow:auto}
.modal .box{background:var(--bg2);border:1px solid var(--line);border-radius:14px;max-width:880px;width:100%;padding:16px}

@media(max-width:640px){header.top .wrap{height:auto;flex-wrap:wrap;padding:8px 16px;gap:6px}nav{order:3;flex-basis:100%}.timer{font-size:3.4rem}.wrap{padding:0 12px}}</style>

const $ = (s, r = document) => r.querySelector(s);

const S = { me: null, pub: null, cart: [], offset: 0, page: {}, imgv: Date.now() };

const TRAITS = {

  slow: ['Slow', 'Gives no DP and has no defensive presence.'],

const STRATS = {

  defense: ['Main Defensive Bot', 'Defense Bot robots only — normal defensive conditions'],
  blended: ['Blended', 'No EPA boost, +20 DP (unless Slow)']
};
const STATUS = { scheduled: 'Open for sign-up', quals: 'Qualifications', wait: 'Alliance selection soon', selection: 'Alliance selection', playoffs: 'Playoffs', complete: 'Complete', cancelled: 'Cancelled' };
const TYPES = { district: 'District Event', dcmp: 'District Championship', conference: 'Conference', cmpfinals: 'Championship Finals' };
const rkClass = r => String(r || 'f')[0].toLowerCase();
const rk = r => `<span class="rk ${rkClass(r)}">${esc(r)}</span>`;
const traitChip = t => `<span class="chip trait" title="${esc((TRAITS[t] || [])[1] || '')}">${esc((TRAITS[t] || [t])[0])}</span>`;
const priceOf = rank => ((S.pub && S.pub.ranks.find(x => x.rank === rank)) || {}).price || 0;
const fmt = ms => new Date(ms).toLocaleString([], { month: 'short', day: 'numeric', hour: 'numeric', minute: '2-digit' });
const robotImg = id => window.__robotImg ? window.__robotImg(id) : `/api/robot-image/${id}?v=${S.imgv}`;
const fr = name => S.me && (S.me.friends || []).includes(name) ? ' <span class="chip fr">★ Friend</span>' : '';
const sNow = () => Date.now() + S.offset;
const mmss = ms => { ms = Math.max(0, Math.ceil(ms / 1000)); return Math.floor(ms / 60) + ':' + String(ms % 60).padStart(2, '0'); };

function toast(m, err) {
  const t = document.createElement('div'); t.className = 'toast' + (err ? ' err' : ''); t.textContent = m; document.body.appendChild(t);
  setTimeout(() => t.remove(), 3200);
}
async function api(path, method = 'GET', body) {
  const r = await fetch(path, { method, credentials: 'same-origin', headers: body ? { 'Content-Type': 'application/json' } : {}, body: body ? JSON.stringify(body) : undefined });
  const t = await r.text(); let j = null; try { j = t ? JSON.parse(t) : null; } catch (e) {}
  if (!r.ok) throw new Error((j && j.error) || 'Error ' + r.status);
  return j;
}
const H = {}; // click handlers by data-act
document.addEventListener('click', async e => {
  const el = e.target.closest('[data-act]'); if (!el || !H[el.dataset.act]) return;
  e.preventDefault();
  try { await H[el.dataset.act](el, e); } catch (err) { toast(err.message, true); }
});
const app = html => { $('#app').innerHTML = html; };

function robotCard(r, o = {}) {
  const price = o.price === false ? 0 : priceOf(r.rank);
  return `<div class="rcard ${o.cls || ''}" ${o.attr || ''}>
    <div class="pic"><span class="num">${esc(r.number)}</span>${r.image === false ? '' : `<img loading="lazy" src="${robotImg(r.id)}" alt="" onerror="this.remove()">`}${rk(r.rank)}</div>
    <div class="bd"><div class="row"><h3><a href="#/robot/${r.id}">Team ${esc(r.number)}</a></h3><span class="sp"></span>${price ? `<span class="price">${price.toLocaleString()} ⛁</span>` : ''}</div>
    ${r.name ? `<div class="mute small">${esc(r.name)}</div>` : ''}
    ${r.location ? `<div class="mute small">${esc(r.location)}${r.rookie ? ' · rookie ' + esc(r.rookie) : ''}</div>` : ''}
    <div class="stats"><div><b>${esc(r.epa)}</b><span>EPA</span></div><div><b>${esc(r.dp)}</b><span>DP</span></div><div><b>${esc(r.capacity)}</b><span>Capacity</span></div></div>
    <div>${(r.traits || []).map(traitChip).join('')}</div>${o.foot || ''}</div></div>`;
}
const banner = (a, big) => `<div class="bwrap"><div class="banner ${big ? 'big' : ''}"><img src="${window.LOGO || '/logo.png'}" alt=""><div class="ev">${esc(a.eventName)}</div><div class="ch">Champions</div><div class="gm">${esc(a.game || 'REBUILT')}</div></div><div class="cap">${esc(a.season || '')}</div></div>`;

/* ---------- nav / session ---------- */
function nav() {
  const p = S.page.name, a = (h, t, n) => `<a href="#/${h}" class="${p === n ? 'on' : ''}">${t}</a>`;
  $('#nav').innerHTML = S.me
    ? a('home', 'Events', 'home') + a('shop', 'Shop', 'shop') + a('players', 'Players', 'players') + a('districts', 'Districts', 'districts') + (S.me.champ ? a('championship', 'Championship', 'championship') : '') + a('rules', 'Rules', 'rules') + a('player/' + S.me.username, 'My Profile', 'player') + (S.me.isMod ? a('mod', 'Moderator', 'mod') : '') + `<a href="#" data-act="logout">Sign out</a>`
    : a('shop', 'Shop', 'shop') + a('rules', 'Rules', 'rules') + a('login', 'Sign in', 'login');
  $('#tok').innerHTML = S.me ? `<span class="tok" title="Tokens">⛁ ${S.me.tokens.toLocaleString()}</span>` : '';
}
async function refreshMe() { S.me = await api('/api/me'); nav(); }
H.logout = async () => { await api('/api/logout', 'POST'); S.me = null; location.hash = '#/login'; nav(); };

/* ---------- router ---------- */
async function route() {
  const parts = location.hash.replace(/^#\/?/, '').split('/').map(decodeURIComponent);
  const [a, b] = parts; S.page = { name: a || (S.me ? 'home' : 'shop') }; nav();
  const open = ['', 'shop', 'login', 'signup', 'rules'];
  try {
    if (!S.me && !open.includes(a || '')) { location.hash = '#/login'; return; }
    switch (a || '') {
      case '': return S.me ? home() : shop();
      case 'shop': return shop();
      case 'login': return login();
      case 'signup': return signup();
      case 'home': return home();
      case 'event': return eventPage(b);
      case 'robot': return robotPage(b);
      case 'player': return profilePage(b);
      case 'players': return playersPage();
      case 'districts': return districtsPage(b);
      case 'championship': return championshipPage();
      case 'rules': return rulesPage();
      case 'mod': return modPage(b, parts[2]);
      default: return location.hash = '#/';
    }
  } catch (e) { app(`<div class="card"><h2>Something went wrong</h2><p class="err">${esc(e.message)}</p><a class="btn" href="#/">Home</a></div>`); }
}
window.addEventListener('hashchange', route);

/* ---------- shop (before and after account) ---------- */
async function shop() {
  S.pub = await api('/api/public');
  S.page.drawer = drawShop; drawShop();
}
function drawShop() {
  const owned = new Set(S.me ? S.me.inventory.map(r => String(r.id)) : []);
  const budget = S.me ? S.me.tokens : S.pub.starting;
  S.cart = S.cart.filter(id => S.pub.robots.some(r => String(r.id) === String(id)));
  const cartRobots = S.cart.map(id => S.pub.robots.find(r => String(r.id) === String(id)));
  const cost = S.me ? 0 : cartRobots.reduce((s, r) => s + priceOf(r.rank), 0), left = budget - cost;
  const robots = S.pub.robots.slice().sort((a, b) => priceOf(b.rank) - priceOf(a.rank) || a.number - b.number);
  app(`<div class="hero"><div><h1>${S.me ? 'Robot Shop' : 'Build your roster'}</h1>
      <div class="mute">${S.me ? 'Spend tokens earned from matches on more robots.' : `You start with <b class="price">${S.pub.starting.toLocaleString()} ⛁</b> tokens. Buy as many robots as you can afford, then create your account.`}</div></div>
      <span class="sp"></span><div class="tok" style="font-size:1.1rem">${left.toLocaleString()} ⛁ ${S.me ? 'available' : 'left'}</div></div>
    <div class="grid g3">${robots.map(r => {
      const id = String(r.id), p = priceOf(r.rank), inCart = S.cart.map(String).includes(id), has = owned.has(id);
      let foot;
      if (S.me) foot = has ? `<div class="mt chip ok">Owned</div>` : `<button class="mt" data-act="buy" data-id="${id}" ${p > left ? 'disabled' : ''}>Buy for ${p.toLocaleString()} ⛁</button>`;
      else foot = inCart ? `<button class="mt ghost" data-act="cart" data-id="${id}">Remove from roster</button>` : `<button class="mt" data-act="cart" data-id="${id}" ${p > left ? 'disabled' : ''}>Add · ${p.toLocaleString()} ⛁</button>`;
      return robotCard(r, { cls: inCart ? 'sel' : '', foot });
    }).join('')}</div>
    ${S.me ? '' : `<div class="bar"><div class="wrap row"><span>${cartRobots.length} robot${cartRobots.length === 1 ? '' : 's'} selected · ${cost.toLocaleString()} ⛁ spent</span><span class="sp"></span><a href="#/login" class="mute">Already have an account?</a><button data-act="toSignup" ${cartRobots.length ? '' : 'disabled'}>Create account →</button></div></div>`}`);
}
H.cart = el => {
  const id = el.dataset.id, i = S.cart.map(String).indexOf(id);
  if (i >= 0) S.cart.splice(i, 1); else S.cart.push(id);
  saveCart(); drawShop();
};
H.toSignup = () => { location.hash = '#/signup'; };
H.buy = async el => { S.me = await api('/api/shop/buy', 'POST', { robotId: el.dataset.id }); nav(); toast('Robot added to your inventory'); drawShop(); };

/* ---------- auth ---------- */
function login() {
  app(`<div class="card auth"><h2>Sign in</h2>
    <form id="f"><label>Username</label><input name="u" autocomplete="username" required><label>Password</label><input name="p" type="password" autocomplete="current-password" required>
    <div class="err" id="e"></div><div class="row mt"><button>Sign in</button><span class="sp"></span><a href="#/shop">New here? Build your roster →</a></div></form></div>`);

const BR = { 1: 'A1 v A8', 2: 'A4 v A5', 3: 'A2 v A7', 4: 'A3 v A6', 5: 'L1 v L2', 6: 'L3 v L4', 7: 'W1 v W2', 8: 'W3 v W4', 9: 'L7 v W6', 10: 'L8 v W5', 11: 'W7 v W8', 12: 'W9 v W10', 13: 'L11 v W12' };
function bmatch(v, m, n) {

  if (!m) return `<div class="bm"><div class="h">Match ${n}</div><div class="mute">${BR[n]}</div></div>`;
  const row = (i, side) => `<div class="t ${m.winner === side ? 'w' : ''}"><span>${esc(aLabel(v, m.alliances[i]))}</span><span>${m.auto ? (m.winner === side ? 'W' : '') : m.winner ? m[side + '_s'] + (m.tie && m.winner === side ? '*' : '') : live ? '…' : ''}</span></div>`;
  const clk = m.winner && !m.auto;
  return `<div class="bm ${live ? 'live' : ''} ${clk ? 'clk' : ''}" ${clk ? `data-act="matchd" data-m="${m.id}"` : ''}><div class="h">${esc(m.label)}${m.auto ? ' · bye' : ''}${m.tie ? ' · random draw*' : ''}</div>${row(0, 'red')}${row(1, 'blue')}</div>`;
}
function playoffPanel(v) {

      <h2 class="mt">Season</h2><p class="small mute">When district play is done, build the conference championships from each division's top 16. Then a conference winner pair plays the best-of-3 finals automatically. After the finals, start the next season.</p>
      <div class="row"><input id="cst" type="datetime-local" value="${nowLocal}" style="max-width:220px"><button data-act="champ">Create conferences</button></div>
      <div class="row mt"><input id="sn" placeholder="New season (2027)" style="max-width:150px"><input id="sg" placeholder="Game name" style="max-width:190px"><button class="ghost" data-act="season">Start new season</button></div></div></div>
    <div class="card"><div class="row"><h2 style="margin:0">Events</h2><span class="sp"></span><span class="small mute">Test players to sign up:</span><input id="botn" type="number" value="12" min="1" max="35" style="width:80px"></div><div class="tscroll mt"><table><tr><th>Name</th><th>Division</th><th>Type</th><th>Starts</th><th>Status</th><th>Teams</th><th></th></tr>${evs.map(e => `<tr><td><a href="#/event/${e.id}">${esc(e.name)}</a></td><td>${esc(e.division)}</td><td>${esc(TYPES[e.type] || e.type)}</td><td>${fmt(e.startAt)}</td><td>${esc(STATUS[e.status] || e.status)}</td><td>${e.teams}/${e.maxTeams}</td><td>${e.status === 'scheduled' ? `<button class="sm ghost" data-act="bots" data-id="${e.id}">Sign up test players</button> <button class="sm" data-act="startnow" data-id="${e.id}">Start now</button>` : ''}</td></tr>`).join('') || '<tr><td class="mute">No events yet.</td></tr>'}</table></div></div>
    <div class="card"><div class="row"><h2 style="margin:0">Test accounts</h2><span class="sp"></span><span class="small mute">Password for all: <b>test1234</b></span></div>
      <div class="row mt"><input id="tn" type="number" min="1" max="100" value="10" style="width:90px"><select id="td" style="width:auto"><option value="random">Random divisions</option>${S.pub.divisions.map(d => `<option>${d}</option>`).join('')}</select><button data-act="mktest">Create accounts</button><span class="sp"></span><button class="${S.page.confirmAll ? 'warn' : 'ghost'}" data-act="delall">${S.page.confirmAll ? 'Click again to delete ALL test accounts' : 'Delete all test accounts'}</button></div>
      <div class="tscroll mt"><table><tr><th>Username</th><th>Division</th><th>Robots</th><th></th></tr>${(S.page.tests || []).map(t => `<tr><td>${esc(t.username)}</td><td>${esc(t.division)}</td><td>${t.robots.map(esc).join(', ')}</td><td><button class="sm warn" data-act="deltest" data-u="${esc(t.username)}">Delete</button></td></tr>`).join('') || '<tr><td class="mute">No test accounts.</td></tr>'}</table></div>
      <div class="small mute mt">Accounts in a running event can't be deleted until it ends. "Sign up test players" in the Events list enters existing test accounts of that district in the event, it does not create accounts that already exist in that event's district (it never creates new ones).</div></div>
    <div class="card"><div class="row"><h2 style="margin:0">Robots</h2><span class="sp"></span><a class="btn" href="#/mod/robot/new">+ New robot</a></div><div class="tscroll mt"><table><tr><th>Team</th><th>Rank</th><th>EPA</th><th>DP</th><th>Cap</th><th>Traits</th><th></th></tr>${robots.map(r => `<tr><td><a href="#/robot/${r.id}">${esc(r.number)}</a></td><td>${rk(r.rank)}</td><td>${r.epa}</td><td>${r.dp}</td><td>${r.capacity}</td><td>${r.traits.map(traitChip).join('')}</td><td><a href="#/mod/robot/${r.id}">Edit</a></td></tr>`).join('')}</table></div></div>`);
  $('#evf').onsubmit = async ev => {
    ev.preventDefault(); const f = ev.target;
    try { await api('/api/mod/events', 'POST', { name: f.name.value, division: f.division.value, type: f.type.value, startAt: new Date(f.start.value).getTime() }); toast('Event created'); modPage(); } catch (e) { toast(e.message, true); }
  };
}
H.startnow = async el => { await api(`/api/mod/events/${el.dataset.id}/start`, 'POST', {}); toast('Event starting'); modPage(); };
H.bots = async el => { const r = await api('/api/mod/test-accounts', 'POST', { eventId: el.dataset.id, count: +$('#botn').value || 12 }); toast(r.created.length + ' existing test players signed up'); modPage(); };
H.mktest = async () => { const r = await api('/api/mod/test-accounts', 'POST', { count: +$('#tn').value || 1, division: $('#td').value }); toast(r.created.length + ' test accounts created'); modPage(); };
H.deltest = async el => { await api('/api/mod/test-accounts', 'DELETE', { username: el.dataset.u }); toast('Deleted'); modPage(); };
H.delall = async () => { if (!S.page.confirmAll) { S.page.confirmAll = true; setTimeout(() => { if (S.page.confirmAll && S.page.name === 'mod') { S.page.confirmAll = false; const b = $('[data-act=delall]'); if (b) { b.className = 'ghost'; b.textContent = 'Delete all test accounts'; } } }, 4000); const b = $('[data-act=delall]'); b.className = 'warn'; b.textContent = 'Click again to delete ALL test accounts'; return; }
  const r = await api('/api/mod/test-accounts', 'DELETE', { all: true }); toast(r.deleted + ' deleted' + (r.skipped ? ', ' + r.skipped + ' skipped (in a running event)' : '')); modPage(); };
H.grant = async () => { await api('/api/mod/grant', 'POST', { username: $('#gu').value }); toast('Moderator granted'); };
H.revoke = async () => { await api('/api/mod/grant', 'POST', { username: $('#gu').value, revoke: true }); toast('Moderator revoked'); };
H.champ = async () => { const r = await api('/api/mod/championship', 'POST', { startAt: new Date($('#cst').value).getTime() }); toast(`Conferences created: Albany ${r.albany}, Kettering ${r.kettering}`); modPage(); };
H.season = async () => { await api('/api/mod/season', 'POST', { name: $('#sn').value, game: $('#sg').value }); await refreshMe(); toast('New season started'); };

async function robotForm(id) {
  let r = { number: '', name: '', rank: 'B', epa: 0, dp: 0, capacity: 0, location: '', rookie: '', traits: [] };
  if (id && id !== 'new') { const d = await api('/api/robots/' + id); r = d.robot; }
  S.page.img = undefined; S.page.rid = id && id !== 'new' ? id : null;
  const num = (n, l, v) => `<div><label>${l}</label><input name="${n}" type="number" step="any" value="${esc(v)}"></div>`;
  app(`<h1>${S.page.rid ? 'Edit robot ' + esc(r.number) : 'New robot'}</h1><div class="card"><form id="rf">
    <div class="grid g3" style="gap:10px">${num('number', 'Team number', r.number)}<div><label>Name (optional)</label><input name="name" value="${esc(r.name)}"></div>
    <div><label>Rank (sets price)</label><select name="rank">${S.pub.ranks.map(x => `<option ${x.rank === r.rank ? 'selected' : ''} value="${x.rank}">${x.rank} — ${x.price.toLocaleString()} ⛁</option>`).join('')}</select></div>
    ${num('epa', 'EPA', r.epa)}${num('dp', 'DP', r.dp)}${num('capacity', 'Capacity', r.capacity)}
    <div><label>Operating location</label><input name="location" value="${esc(r.location)}"></div>${num('rookie', 'Rookie year', r.rookie)}</div>
    <label>Traits (stackable)</label><div class="checks">${S.pub.traits.map(t => `<label><input type="checkbox" name="t" value="${t}" ${r.traits.includes(t) ? 'checked' : ''}>${esc(TRAITS[t][0])}</label>`).join('')}</div>
    <label>Robot card image</label><input type="file" id="img" accept="image/*"><div id="prev" class="mt">${S.page.rid && r.image ? `<img src="${robotImg(r.id)}" style="max-width:240px;border-radius:10px">` : ''}</div>
    <div class="row mt"><button>${S.page.rid ? 'Save changes' : 'Create robot'}</button><a href="#/mod" class="mute">Cancel</a></div></form></div>`);
  $('#img').onchange = async e => {
    const f = e.target.files[0]; if (!f) return;
    const url = URL.createObjectURL(f), im = new Image(); im.src = url; await im.decode();
    const k = Math.min(1, 800 / im.width), c = document.createElement('canvas'); c.width = im.width * k; c.height = im.height * k; c.getContext('2d').drawImage(im, 0, 0, c.width, c.height);
    S.page.img = c.toDataURL(f.type === 'image/png' ? 'image/png' : 'image/jpeg', .88); $('#prev').innerHTML = `<img src="${S.page.img}" style="max-width:240px;border-radius:10px">`;
  };
  $('#rf').onsubmit = async ev => {
    ev.preventDefault(); const f = ev.target;
    const body = { number: f.number.value, name: f.name.value, rank: f.rank.value, epa: f.epa.value, dp: f.dp.value, capacity: f.capacity.value, location: f.location.value, rookie: f.rookie.value, traits: [...f.querySelectorAll('[name=t]:checked')].map(x => x.value) };
    if (S.page.img) body.image = S.page.img;
    try {
      if (S.page.rid) await api('/api/mod/robots/' + S.page.rid, 'PUT', body); else await api('/api/mod/robots', 'POST', body);
      S.imgv = Date.now(); toast('Robot saved'); location.hash = '#/mod';
    } catch (e) { toast(e.message, true); }
  };
}


</script>

</body></html>
